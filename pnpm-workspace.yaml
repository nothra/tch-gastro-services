# Post-install-Build-Skripte, die pnpm ausführen darf (pnpm 11+).
# sharp = Next.js Bildoptimierung, unrs-resolver = ESLint-Import-Resolver,
# esbuild = von drizzle-kit genutzt (Migrations-Tooling).
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Sicherheits-Overrides: heben verwundbare, transitiv gepinnte Kopien auf den
# jeweiligen Patch-Floor. Konditionale Form (paket@<version) → greift NUR unterhalb
# des Patches; spätere legitime Upgrades der Parents (next, drizzle-kit) fließen
# ungehindert durch. Entfernen, sobald die Parents die Patches selbst mitbringen –
# gemessen, nicht vermutet (#291: für esbuild traf die Vermutung nicht zu, für nanoid schon).
#
# Ziel-Range bei NEUEN Einträgen als Caret innerhalb DERSELBEN Major-Linie (^1.1.18 statt
# >=1.1.18): ein offenes >= lässt pnpm auf die neueste Major springen und schiebt damit einen
# Major-Bump in einen Baum, der ihn nicht angefordert hat (#291: `>=` hätte die von
# minimatch@3 erwartete brace-expansion@1.x auf 2.x gehoben). Die Alt-Einträge esbuild und uuid
# tragen noch die offene Form – bei uuid mit messbarer Wirkung (aufgelöst 14.0.1, während
# exceljs ^8.3.2 deklariert). Ihre Umstellung liegt außerhalb des #291-Scopes und ist als
# Kleinfund abgelegt (docs/factory/kleinfunde.md).
#
# KEIN nanoid-Eintrag: in #291 angelegt und nach Messung wieder entfernt. postcss@8.5.26
# deklariert selbst nanoid ^3.3.17, und der Lockfile kennt genau eine nanoid-Kante (aus postcss) –
# nach dem Streichen löste der Baum weiterhin nanoid@3.3.18 auf (GHSA-2v37-7h3g-55p8, Floor
# 3.3.17, erfüllt). Der Floor folgt also aus der Range derjenigen postcss-Version, die der
# postcss-Eintrag unten erzwingt; weil dieser dauerhaft bleibt (next pinnt postcss exakt), ist
# der nanoid-Floor dauerhaft mitgedeckt. Nicht wieder anlegen, ohne erneut zu messen.
#
# - postcss  <8.5.23: GHSA-r28c-9q8g-f849 (high, Floor 8.5.18) und GHSA-fxqj-rqcc-2cmp
#            (medium, Floor 8.5.23) – der höhere Floor gewinnt; der ursprüngliche 8.5.10-Eintrag
#            aus #167 (GHSA-qx2v-qp2m-jg93, XSS im CSS-Stringify) geht darin auf. Via next
#            (Build-Zeit). Floor angehoben statt zweiter Eintrag daneben (#169/#291). Das
#            Entfern-Kriterium oben ist hier unerreichbar, solange next postcss EXAKT auf
#            8.4.31 pinnt – der Eintrag bleibt.
# - brace-expansion: zwei DISJUNKTE Selektoren, weil 1.x und 2.x getrennte Floors tragen.
#            GHSA-rgw5-rvv9-x895 setzt beide (1.1.18 bzw. 2.1.4) und schließt die älteren
#            GHSA-3jxr-9vmj-r5cp (1.1.16) und GHSA-mh99-v99m-4gvg (1.1.17 / 2.1.3) ein.
#            Ohne die untere Grenze am 2er-Selektor (`>=2.0.0 <2.1.4`)
#            griffe er auch auf 1.1.x und höbe sie über die Major-Grenze (#291, empirisch belegt).
#            <1.1.18 via minimatch@3, >=2.0.0 <2.1.4 via minimatch@5 – beide runtime.
# - sharp    <0.35.0: GHSA-f88m-g3jw-g9cj (high), via next (Bildoptimierung, optionale Dep).
#            Minor-Bump, kein Patch –
#            deshalb steht sharp in allowBuilds und der Post-Install-Build muss durchlaufen (#291).
#            Bewusst AUSSERHALB der von next deklarierten Range ^0.34.5 (= <0.35.0): weil sharp
#            eine optionale und keine Peer-Dependency ist, warnt pnpm install dabei nicht, der
#            Range-Bruch bliebe also unbemerkt. Vertretbar, weil die App next/image nirgends
#            nutzt und next.config.ts keine images-Config trägt – sharp wird zur Laufzeit nie
#            aufgerufen, das Restrisiko ist praktisch null (#291, Review-Finding).
# - undici   <7.29.0: GHSA-4cwx-7wf7-3272 (high) plus GHSA-8xcm-r25x-g524, GHSA-jr45-8vmc-qm54,
#            GHSA-m8rv-5g2x-5cg5, GHSA-v3r7-h72x-cjcm (medium) – alle mit Floor 7.29.0.
#            Via jsdom (Vitest-Environment, dev-Scope), #291
# - js-yaml  <4.3.1:  GHSA-5p4m-2wfm-xmqj (high), via eslint (dev-Scope), #291
# - esbuild  <0.25.0: GHSA-67mh-4wv8-2f99 (Dev-Server-Request-Leak), via drizzle-kit (dev).
#            Nachweislich KEIN No-op: ohne den Eintrag löst der Baum esbuild@0.18.20 auf
#            (in #291 durch Entfernen + Neuinstallation verifiziert).
# - uuid     <11.1.1: GHSA-w5hq-g745-h8pq (fehlende Buffer-Bounds-Prüfung bei v3/v5/v6 mit
#            `buf`-Argument), via exceljs (Bericht-Renderer, #189)
overrides:
  "postcss@<8.5.23": "^8.5.23"
  "brace-expansion@<1.1.18": "^1.1.18"
  "brace-expansion@>=2.0.0 <2.1.4": "^2.1.4"
  "sharp@<0.35.0": "^0.35.0"
  "undici@<7.29.0": "^7.29.0"
  "js-yaml@<4.3.1": "^4.3.1"
  "esbuild@<0.25.0": ">=0.25.0"
  "uuid@<11.1.1": ">=11.1.1"
