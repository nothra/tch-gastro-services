# Post-install-Build-Skripte, die pnpm ausführen darf (pnpm 11+).
# sharp = Next.js Bildoptimierung, unrs-resolver = ESLint-Import-Resolver,
# esbuild = von drizzle-kit genutzt (Migrations-Tooling).
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Sicherheits-Overrides: heben verwundbare, transitiv gepinnte Kopien auf den
# jeweiligen Patch-Floor. Konditionale Form (paket@<version) → greift NUR unterhalb
# des Patches; spätere legitime Upgrades der Parents (next, drizzle-kit) fließen
# ungehindert durch. Entfernen, sobald die Parents die Patches selbst mitbringen –
# gemessen, nicht vermutet (#291: für esbuild traf die Vermutung nicht zu, für nanoid schon;
# #337: postcss, sharp und js-yaml waren nach dem next-16.3.5-Bump messbar No-ops, siehe unten).
#
# Ziel-Range bei NEUEN Einträgen als Caret innerhalb DERSELBEN Major-Linie (^1.1.18 statt
# >=1.1.18): ein offenes >= lässt pnpm auf die neueste Major springen und schiebt damit einen
# Major-Bump in einen Baum, der ihn nicht angefordert hat (#291: `>=` hätte die von
# minimatch@3 erwartete brace-expansion@1.x auf 2.x gehoben).
# AUSNAHME von "DERSELBEN Major-Linie" (belegt, #339): Trägt die Linie des Selektors keinen
# eigenen Fix, weil das Advisory sie in einer höheren Linie patcht, zeigt der Caret in DIESE
# Fix-Linie – so brace-expansion@>=4.0.0 <5.0.9 → ^5.0.9 (in der 4er-Linie sind nur 4.0.0 und
# 4.0.1 veröffentlicht, first_patched_version beider Advisories liegt bei 5.0.9/5.0.8). Die
# Caret-Form bleibt Pflicht, sie begrenzt dann die Fix-Linie nach oben. Der Guard
# caret_violations_291 kann diese Ausnahme nicht sehen – er prüft nur die Caret-SYNTAX, nicht die
# Major-Gleichheit; sie steht deshalb hier als Prosa-Anker, damit ein späterer Durchlauf die
# untere Schranke nicht "regelkonform" auf >=5.0.0 stellt und die 4.x-Lücke wieder aufreißt.
# Die Alt-Einträge esbuild und uuid
# tragen noch die offene Form – bei uuid mit messbarer Wirkung (aufgelöst 14.0.1, während
# exceljs ^8.3.2 deklariert). Ihre Umstellung liegt außerhalb des #291-Scopes und ist als
# Kleinfund abgelegt (docs/factory/kleinfunde.md).
#
# KEIN nanoid-Eintrag: in #291 angelegt und nach Messung wieder entfernt. postcss deklariert
# selbst nanoid ^3.3.17, und der Lockfile kennt nanoid ausschließlich über postcss-Kanten – nach
# dem Streichen löste der Baum weiterhin nanoid@3.3.x auf (GHSA-2v37-7h3g-55p8, Floor 3.3.17,
# erfüllt; #337 frisch aufgelöst: 3.3.18 an beiden postcss-Snapshots). Der Floor folgt also aus
# der Range derjenigen postcss-Version, die im Baum landet; seit #337 erzwingt die nicht mehr ein
# Override, sondern next selbst – es pinnt postcss EXAKT auf 8.5.23, und diese Version deklariert
# nanoid ^3.3.17. Nicht wieder anlegen, ohne erneut zu messen.
#
# ENTFERNT in #337, nachdem der next-16.3.5-Bump sie zu No-ops gemacht hat. Methode je Eintrag
# (lessons/build-tooling.md): Eintrag streichen, ohne Alt-Lockfile neu auflösen, aufgelöste
# Version prüfen – nicht aus der Parent-Range annehmen. Der Floor-Guard in
# scripts/checks/tests/run-tests.sh (#291/#337) prüft weiterhin die AUFGELÖSTEN Versionen;
# rutscht eine davon zurück, wird der jeweilige Eintrag wieder nötig.
# - postcss  <8.5.23: GHSA-r28c-9q8g-f849 (high, Floor 8.5.18) und GHSA-fxqj-rqcc-2cmp
#            (medium, Floor 8.5.23), via next (Build-Zeit); darin ging der 8.5.10-Eintrag aus
#            #167 auf (GHSA-qx2v-qp2m-jg93). next 16.3.5 pinnt postcss exakt auf 8.5.23 statt
#            wie 16.2.x auf 8.4.31 – damit ist das in #169/#291 als unerreichbar notierte
#            Entfern-Kriterium erreicht. Frisch gemessen ohne den Eintrag: 8.5.23 (via next)
#            und 8.5.26 (via tailwindcss bzw. vite/rolldown), beide auf/über dem Floor.
#            Erledigt damit #169.
# - sharp    <0.35.0: GHSA-f88m-g3jw-g9cj (high), via next (Bildoptimierung, optionale Dep).
#            next 16.3.5 deklariert sharp selbst als ^0.35.4; frisch gemessen ohne den Eintrag:
#            0.35.4. Nebeneffekt: die in #291 bewusst hingenommene Range-Verletzung (Override
#            außerhalb der von next deklarierten ^0.34.5) ist damit aufgelöst. sharp bleibt in
#            allowBuilds – die optionale Dep liegt weiter im Baum und braucht ihren
#            Post-Install-Build.
# - js-yaml  <4.3.1: GHSA-5p4m-2wfm-xmqj (high), via eslint (dev-Scope). Frisch gemessen ohne
#            den Eintrag: 4.3.2, also auf dem in #337 geforderten Floor.
#
# WEITERHIN NÖTIG – je Eintrag Advisory, Floor-Begründung und Herkunft im Baum:
# - brace-expansion: drei DISJUNKTE Selektoren, weil 1.x, 2.x und 4.x/5.x getrennte Floors
#            tragen. GHSA-rgw5-rvv9-x895 setzt alle drei (1.1.18 / 2.1.4 / 5.0.9) und schließt
#            die älteren GHSA-3jxr-9vmj-r5cp (1.1.16) und GHSA-mh99-v99m-4gvg (1.1.17 / 2.1.3 /
#            5.0.8) ein. Ohne die untere Grenze am 2er-Selektor (`>=2.0.0 <2.1.4`)
#            griffe er auch auf 1.1.x und höbe sie über die Major-Grenze (#291, empirisch belegt).
#            <1.1.18 via minimatch@3, >=2.0.0 <2.1.4 via minimatch@5 – beide runtime.
#            >=4.0.0 <5.0.9 via minimatch@10 (@typescript-eslint/typescript-estree) – dev-only,
#            ergänzt in #339, gefunden in der Security-Review von #337. No-op-Kriterium nach
#            beiden Methoden gemessen, mit unterschiedlichem Ergebnis: gegen das BESTEHENDE
#            Lockfile kein No-op (der Eintrag hob die dort festgeschriebene 5.0.7 auf 5.0.12;
#            ohne ihn hätte --frozen-lockfile die 5.0.7 behalten), gegen eine FRISCH-AUFLÖSUNG
#            ohne Alt-Lockfile dagegen schon – ein Wegwerf-Projekt mit nur minimatch@10.2.5 löst
#            auch ohne jeden Override 5.0.12 auf. Der Eintrag bleibt trotzdem nötig, und zwar
#            anders als bei nanoid: dort erfüllt die deklarierte Untergrenze (^3.3.17) den Floor
#            selbst, hier liegt die von minimatch@10 deklarierte Untergrenze ^5.0.5 UNTER dem
#            Floor 5.0.9. Der Eintrag ist damit die einzige durable Zusicherung >= 5.0.9.
#            Untere Schranke `>=4.0.0` statt `>=5.0.0`, weil die Advisories die 4er-Linie
#            mit demselben Floor in der 5er-Linie patchen (4.x hat keinen eigenen Fix).
#            KEIN 3.x-Selektor, obwohl die 3er-Linie parallel gepflegt wird (dist-tag 3.x =
#            3.0.9) und eigene Floors trägt (GHSA-rgw5-rvv9-x895 → 3.0.6, GHSA-mh99-v99m-4gvg →
#            3.0.3): der Baum löst heute keine 3.x-Kopie auf. Zieht ein Parent künftig eine
#            herein, braucht es einen vierten Selektor `>=3.0.0 <3.0.6`. Damit das nicht still
#            passiert, wacht seit #339 ein Major-3-Fall im Floor-Guard
#            (scripts/checks/tests/run-tests.sh) darüber – heute grün, rot sobald eine 3.x-Kopie
#            unter 3.0.6 einzieht.
# - undici   <7.29.0: GHSA-4cwx-7wf7-3272 (high) plus GHSA-8xcm-r25x-g524, GHSA-jr45-8vmc-qm54,
#            GHSA-m8rv-5g2x-5cg5, GHSA-v3r7-h72x-cjcm (medium) – alle mit Floor 7.29.0.
#            Via jsdom (Vitest-Environment, dev-Scope), #291
# - esbuild  <0.25.0: GHSA-67mh-4wv8-2f99 (Dev-Server-Request-Leak), via drizzle-kit (dev).
#            Nachweislich KEIN No-op: ohne den Eintrag löst der Baum esbuild@0.18.20 auf
#            (in #291 durch Entfernen + Neuinstallation verifiziert).
# - uuid     <11.1.1: GHSA-w5hq-g745-h8pq (fehlende Buffer-Bounds-Prüfung bei v3/v5/v6 mit
#            `buf`-Argument), via exceljs (Bericht-Renderer, #189)
overrides:
  "brace-expansion@<1.1.18": "^1.1.18"
  "brace-expansion@>=2.0.0 <2.1.4": "^2.1.4"
  "brace-expansion@>=4.0.0 <5.0.9": "^5.0.9"
  "undici@<7.29.0": "^7.29.0"
  "esbuild@<0.25.0": ">=0.25.0"
  "uuid@<11.1.1": ">=11.1.1"
