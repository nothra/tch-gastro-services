# Projekt-CI (TCH) – Lint + Tests der App
#
# Projekteigen (docs/factory/OWNERSHIP.md): aus factory-ci.yml herausgelöst (#431), damit
# factory-ci.yml keinen pnpm-Aufruf mehr enthält. Job-Namen `lint`/`test`, Trigger und
# Inhalt unverändert – die Required Checks von `protect-main` bleiben gleich (Factory-ADR-029).
#
# Konfiguration über die Repository-Variablen FACTORY_LINT_COMMAND / FACTORY_TEST_COMMAND
# (Settings → Secrets and variables → Actions → Variables, Q7). Die lokalen Hooks lesen
# dieselben Kommandos aus factory.config.yml (`commands.*`); die Repo-Variablen bleiben die
# CI-Quelle, beide Werte müssen übereinstimmen.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ─── Projekt-Lint ───────────────────────────────────────────────────────────
  # Konfiguration über die Repository-Variable FACTORY_LINT_COMMAND (Q7) – lokal liest
  # scripts/checks/pre-commit.sh denselben Befehl. Beide Werte müssen übereinstimmen.
  #
  # Bewusste "fail vs. allow"-Entscheidung: Hooks lassen bei fehlender Konfig durch
  # (lokaler Komfort), CI failt (zentrale Schleuse) – genau "Gates statt Vertrauen".
  # Ein grünes No-Op-Gate wäre gefährlicher als kein Gate.
  lint:
    runs-on: ubuntu-latest
    env:
      FACTORY_LINT_COMMAND: ${{ vars.FACTORY_LINT_COMMAND }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile
      - name: Lint-Gate (fail-closed)
        run: |
          if [ -z "${FACTORY_LINT_COMMAND:-}" ]; then
            echo "FACTORY_LINT_COMMAND nicht gesetzt – als Repository-Variable konfigurieren."
            echo "Gleicher Wert wie in scripts/checks/pre-commit.sh (Werte müssen übereinstimmen)."
            exit 1
          fi
          eval "$FACTORY_LINT_COMMAND"

  # ─── Projekt-Tests ──────────────────────────────────────────────────────────
  # Konfiguration über die Repository-Variable FACTORY_TEST_COMMAND (Q7) – lokal liest
  # scripts/checks/pre-push.sh denselben Befehl. Beide Werte müssen übereinstimmen.
  test:
    runs-on: ubuntu-latest
    env:
      FACTORY_TEST_COMMAND: ${{ vars.FACTORY_TEST_COMMAND }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile
      - name: Test-Gate (fail-closed)
        run: |
          if [ -z "${FACTORY_TEST_COMMAND:-}" ]; then
            echo "FACTORY_TEST_COMMAND nicht gesetzt – als Repository-Variable konfigurieren."
            echo "Gleicher Wert wie in scripts/checks/pre-push.sh (Werte müssen übereinstimmen)."
            exit 1
          fi
          eval "$FACTORY_TEST_COMMAND"
      # Projekt-Suite (#432, Q10): Tests der projekteigenen Dateien (Routen-Doku-Check, Deploy-Freeze,
      # Deploy-Workflows). Läuft im Required Check `test` – ein Fehlschlag macht ihn rot (kein Check-Name neu).
      - name: yq bereitstellen
        run: sudo bash scripts/install-yq.sh
      - name: Projekt-Suite
        run: bash scripts/project/tests/run-project-tests.sh
